<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bonsai Sushi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
const IMG='https://raw.githubusercontent.com/liraluis60-sketch/Bonsai-Sushi/refs/heads/main/Imagenes/';
const EMB=`<span class="emb"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="49" fill="#120806"/><circle cx="50" cy="50" r="43" fill="#B3182E"/><circle cx="50" cy="50" r="35" fill="#F5C400"/><path d="M30 46c8-6 18-8 26-4 6-6 10-14 6-22-4-4-10 0-10 4 0-4-6-8-10-2-4 6 4 10 4 14-10-2-18 4-22 10z M44 52c-1 8-2 16-6 22h8c4-6 6-12 6-18z M52 52c2 8 4 14 8 20h-8c-4-6-6-12-6-18z" fill="#120806"/></svg></span>`;
function lf(el){el.outerHTML=el.dataset.f==='e'?EMB:'<span class="fb">BONSAI <b>SUSHI</b></span>'}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#070707;--s1:#121212;--s2:#1B1B1D;--s3:#26262A;--red:#C8102E;--red2:#E0283F;--gold:#F5C400;
  --txt:#F5F5F7;--mut:#8E8E93;--line:rgba(255,255,255,.08);
  --ease:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.34,1.45,.64,1);
  --tab:calc(64px + env(safe-area-inset-bottom,0px));
}
html{scroll-behavior:smooth}
body{font-family:Inter,-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:var(--tab)}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:transform .25s var(--ease),background .3s,color .3s,opacity .3s}
button:active{transform:scale(.95)}
button:disabled{opacity:.35;transform:none;cursor:not-allowed}
img{display:block;max-width:100%}
.wrapper{max-width:1100px;margin:0 auto}
.emb{display:block;width:100%;height:100%}
.emb svg{width:100%;height:100%;display:block}
.fb{font-weight:800;letter-spacing:.12em;font-size:15px}
.fb b{color:var(--gold)}

/* ===== Splash ===== */
#splash{position:fixed;inset:0;z-index:9999;background:#000;display:grid;place-items:center;transition:opacity .7s var(--ease),transform .7s var(--ease),visibility .7s}
#splash.done{opacity:0;visibility:hidden;transform:scale(1.06)}
.sp{text-align:center}
.sp-logo{width:150px;height:150px;margin:0 auto;border-radius:50%;position:relative;animation:logoIn 1.1s var(--spring) both}
.sp-logo::after{content:'';position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(245,196,0,.5);animation:ring 1.6s .6s var(--ease) both}
.sp-word{margin-top:26px;font-size:20px;font-weight:700;letter-spacing:.42em;padding-left:.42em;animation:up .9s .5s var(--ease) both}

/* ===== Top bar ===== */
.top{position:fixed;top:0;left:0;right:0;z-index:100;padding:env(safe-area-inset-top,0px) 16px 0;height:calc(58px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;justify-content:space-between;background:rgba(7,7,7,.6);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border-bottom:.5px solid transparent;transition:border-color .3s,background .3s}
.top.s{border-color:var(--line);background:rgba(7,7,7,.85)}
.top .logo{width:38px;height:38px;cursor:pointer;transition:transform .6s var(--spring)}
.top .logo:hover{transform:rotate(-12deg)}
.top .fb{font-size:13px}
.pill{display:flex;align-items:center;gap:10px;height:40px;padding:0 6px 0 16px;border-radius:99px;background:var(--red);font-weight:700;font-size:14px;box-shadow:0 8px 20px -8px rgba(200,16,46,.9)}
.pill .n{min-width:28px;height:28px;border-radius:99px;background:#fff;color:var(--red);display:grid;place-items:center;font-size:13px;font-weight:800;padding:0 7px}
.bump{animation:bump .5s var(--spring)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}

/* ===== Hero + promos ===== */
.hero{padding:calc(58px + env(safe-area-inset-top,0px) + 28px) 20px 8px;text-align:center}
.hero .hi{color:var(--mut);font-size:14px;font-weight:500;animation:up .8s var(--ease) both}
.hero .hl{width:min(300px,78vw);height:auto;margin:6px auto 4px;animation:up .9s .1s var(--ease) both;filter:drop-shadow(0 10px 30px rgba(200,16,46,.25))}
.hero h1{font-size:40px;font-weight:800;letter-spacing:-.02em;margin:4px 0 14px;animation:up .9s .15s var(--ease) both}
.hero h1 span{color:var(--gold)}
.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;animation:up .9s .25s var(--ease) both}
.chips span{font-size:12px;font-weight:600;padding:7px 12px;border-radius:99px;background:var(--s2);color:var(--txt)}
.chips span b{color:var(--gold)}

.sec{padding:34px 0 0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 20px;margin-bottom:14px}
.sec-h h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.sec-h a{color:var(--gold);font-size:14px;font-weight:600;text-decoration:none;cursor:pointer}

.hs{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 20px 8px;scrollbar-width:none;scroll-padding:0 20px}
.hs::-webkit-scrollbar{display:none}
.promo{flex:0 0 84%;max-width:360px;scroll-snap-align:start;border-radius:24px;padding:22px;min-height:230px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(140deg,var(--red) 0%,#5a0816 100%);box-shadow:0 20px 40px -18px rgba(200,16,46,.7);transition:transform .5s var(--ease)}
.promo.g{background:linear-gradient(140deg,#F5C400 0%,#B88F00 100%);color:#111}
.promo.k{background:linear-gradient(140deg,#2a2a2e 0%,#0b0b0c 100%);box-shadow:0 20px 40px -18px rgba(0,0,0,.9)}
.promo:active{transform:scale(.98)}
.promo .tag{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.28)}
.promo h3{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:14px 0 6px}
.promo p{font-size:14px;opacity:.85;max-width:230px}
.promo .ft{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.promo .pr{font-size:22px;font-weight:800}
.promo .go{height:38px;padding:0 16px;border-radius:99px;background:#fff;color:#111;font-size:13px;font-weight:700}
.promo .big{position:absolute;right:-18px;top:-14px;font-size:120px;opacity:.22;transform:rotate(12deg)}

.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 20px}
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:20px;background:var(--s1);border:.5px solid var(--line);font-size:13px;font-weight:600;transition:transform .4s var(--spring),background .3s}
.cat:hover{background:var(--s2)}
.cat i{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;font-style:normal;background:linear-gradient(145deg,var(--s3),var(--s1))}
.cat:nth-child(3n+1) i{background:linear-gradient(145deg,#4a0b15,#1a0608)}
.cat:nth-child(3n+2) i{background:linear-gradient(145deg,#4a3a00,#1a1500)}

/* ===== Lista de productos ===== */
.menu-h{padding:44px 20px 0}
.menu-h h2{font-size:34px;font-weight:800;letter-spacing:-.025em}
.menu-h p{color:var(--mut);font-size:14px;margin-top:4px}
.tabs{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:60;display:flex;gap:8px;overflow-x:auto;padding:14px 20px;scrollbar-width:none;background:linear-gradient(var(--bg) 80%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;height:36px;padding:0 16px;border-radius:99px;background:var(--s2);color:var(--mut);font-size:14px;font-weight:600}
.tab.on{background:var(--txt);color:#000}
.list{display:grid;gap:12px;padding:0 20px;grid-template-columns:1fr}
@media(min-width:760px){.list{grid-template-columns:1fr 1fr;gap:16px}.cats{grid-template-columns:repeat(6,1fr)}.hero h1{font-size:56px}}
.grid-anim{transition:opacity .3s,transform .3s var(--ease)}
.grid-anim.out{opacity:0;transform:translateY(12px)}
.item{display:flex;gap:14px;padding:12px;background:var(--s1);border-radius:22px;border:.5px solid var(--line);cursor:pointer;animation:up .6s var(--ease) both;animation-delay:calc(var(--i)*55ms);transition:transform .4s var(--ease),background .3s}
.item:hover{background:var(--s2)}
.item:active{transform:scale(.985)}
.thumb{position:relative;flex-shrink:0;width:104px;height:104px;border-radius:16px;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 40% 30%,#3a1218,#161618 70%)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease)}
.item:hover .thumb img{transform:scale(1.07)}
.thumb .em{font-size:40px;position:relative;z-index:1}
.thumb img+.em{display:none}
.ib{flex:1;min-width:0;display:flex;flex-direction:column}
.ib h3{font-size:16px;font-weight:700;letter-spacing:-.01em}
.ib p{font-size:13px;color:var(--mut);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ft2{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:center}
.price{font-size:16px;font-weight:700}
.plus{width:36px;height:36px;border-radius:99px;background:var(--red);color:#fff;font-size:22px;font-weight:500;display:grid;place-items:center;box-shadow:0 6px 14px -6px rgba(200,16,46,.9)}
.plus:hover{background:var(--red2)}
.plus.ok{background:#30D158;font-size:16px}

.hs.sq .item{flex-direction:column;flex:0 0 160px;scroll-snap-align:start;padding:10px}
.hs.sq .thumb{width:100%;height:150px}
.hs.sq .ib p{display:none}

.foot{padding:50px 20px 30px;text-align:center}
.foot .big-btn{width:100%;max-width:420px;height:56px;border-radius:18px;background:#30D158;color:#fff;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.foot .pays{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:26px 0}
.foot .pays span{font-size:12px;padding:8px 12px;border-radius:99px;background:var(--s1);border:.5px solid var(--line);color:var(--mut)}
.foot small{color:#56565c;font-size:12px}

/* ===== Tab bar ===== */
.tb{position:fixed;left:0;right:0;bottom:0;z-index:150;height:var(--tab);padding:8px 10px env(safe-area-inset-bottom,0px);display:flex;justify-content:space-around;
  background:rgba(18,18,18,.78);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);border-top:.5px solid var(--line)}
.tb button{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:58px;font-size:10.5px;font-weight:600;color:var(--mut);position:relative}
.tb button i{font-style:normal;font-size:21px;line-height:1}
.tb button.on{color:var(--txt)}
.tb .dot{position:absolute;top:-2px;right:8px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:none;place-items:center}
.tb .dot.show{display:grid}
@media(min-width:760px){.tb{left:50%;translate:-50%;width:min(520px,calc(100% - 32px));bottom:16px;height:66px;border-radius:26px;border:.5px solid var(--line)}}

/* ===== Hojas ===== */
.wrap{position:fixed;inset:0;z-index:500;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
.wrap.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:560px;max-height:92svh;display:flex;flex-direction:column;overflow:hidden;background:#161618;border-radius:34px 34px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(105%);transition:transform .55s var(--ease);box-shadow:0 -10px 60px rgba(0,0,0,.6)}
.wrap.open .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:9px;background:#3a3a3e;margin:8px auto 2px;flex-shrink:0}
.sh-top{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 12px}
.sh-top h3{font-size:19px;font-weight:700}
.close{width:32px;height:32px;border-radius:99px;background:var(--s3);color:var(--mut);font-size:16px;display:grid;place-items:center}
.sh-body{overflow-y:auto;padding:0 20px 16px;flex:1}
.sh-foot{padding:14px 20px 20px;border-top:.5px solid var(--line);background:#161618}
@media(min-width:760px){.wrap{align-items:center}.sheet{border-radius:30px;transform:translateY(24px) scale(.96);opacity:0;transition:transform .55s var(--spring),opacity .4s}.wrap.open .sheet{transform:none;opacity:1}.grab{display:none}}
.pv-img{position:relative;height:250px;margin:0 0 18px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 40% 30%,#3a1218,#161618 70%)}
.pv-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pv-img .em{font-size:100px}
.pv-img img+.em{display:none}
.pv-name{font-size:24px;font-weight:800;letter-spacing:-.02em}
.pv-desc{color:var(--mut);margin:6px 0 16px;font-size:15px}
.pv-price{font-size:22px;font-weight:700;color:var(--gold);margin-bottom:6px}
.qty{display:flex;align-items:center;gap:0;background:var(--s3);border-radius:99px;height:50px}
.qty button{width:50px;height:50px;font-size:22px;font-weight:500;display:grid;place-items:center}
.qty span{min-width:30px;text-align:center;font-weight:700;font-size:17px}
.btn{width:100%;height:56px;border-radius:18px;background:var(--red);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 12px 24px -10px rgba(200,16,46,.9)}
.btn:hover:not(:disabled){background:var(--red2)}
.btn.wa{background:#30D158;box-shadow:0 12px 24px -10px rgba(48,209,88,.8)}
.btn.wa:hover:not(:disabled){background:#2bc24f}
.btn.ghost{background:var(--s3);box-shadow:none;color:var(--txt)}
.row2{display:flex;gap:12px;align-items:center}
.row2 .qty{flex-shrink:0}
.row2 .btn{flex:1}
.ci{display:flex;align-items:center;gap:12px;padding:10px;margin-bottom:10px;background:var(--s2);border-radius:18px}
.ci .thumb{width:58px;height:58px;border-radius:12px}
.ci .thumb .em{font-size:26px}
.ci .info{flex:1;min-width:0}
.ci .info b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .info small{color:var(--mut);font-size:13px}
.ci .qty{height:36px}
.ci .qty button{width:36px;height:36px;font-size:18px}
.ci .qty span{min-width:22px;font-size:14px}
.ci .tot{font-weight:700;min-width:50px;text-align:right;font-size:15px}
.sum{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sum span{color:var(--mut);font-size:14px}
.sum b{font-size:26px;font-weight:800;color:var(--gold)}
.seg{display:flex;background:var(--s3);border-radius:12px;padding:3px;margin-bottom:18px}
.seg button{flex:1;height:38px;border-radius:9px;font-size:14px;font-weight:600;color:var(--mut)}
.seg button.on{background:#5a5a60;color:#fff}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--mut);margin-bottom:8px;font-weight:500}
.field input{width:100%;height:50px;padding:0 16px;border-radius:14px;background:var(--s2);border:0;color:var(--txt);font:inherit;font-size:16px;outline:none;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .3s}
.field input:focus{box-shadow:inset 0 0 0 2px var(--red)}
.sumbox{background:var(--s2);border-radius:16px;padding:14px 16px;margin-bottom:6px}
.sumbox div{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin-bottom:8px}
.sumbox .t{color:var(--txt);font-weight:700;margin:0;padding-top:8px;border-top:.5px solid var(--line)}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}
.empty i{font-style:normal;font-size:52px;display:block;margin-bottom:10px;animation:bob 2.4s ease-in-out infinite}

/* Toast tipo Dynamic Island */
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;z-index:900;translate:-50%;transform:translateY(-160%);background:#000;color:#fff;border-radius:99px;padding:12px 22px 12px 14px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:0 12px 30px rgba(0,0,0,.6);transition:transform .6s var(--spring);white-space:nowrap}
.toast.show{transform:translateY(0)}
.toast b{width:24px;height:24px;border-radius:99px;background:#30D158;display:grid;place-items:center;font-size:13px}

/* Reveal */
.rv{opacity:0;transform:translateY(28px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.in{opacity:1;transform:none}

@keyframes logoIn{0%{transform:scale(.3) rotate(-60deg);opacity:0}70%{transform:scale(1.06) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes ring{0%{transform:scale(.6);opacity:0}50%{opacity:1}100%{transform:scale(1.25);opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="splash">
  <div class="sp">
    <div class="sp-logo" id="spLogo"><img src="https://raw.githubusercontent.com/liraluis60-sketch/Bonsai-Sushi/refs/heads/main/Imagenes/logo%20bonsai.png" alt="Bonsai Sushi" style="width:100%;height:100%;object-fit:contain" data-f="e" onerror="lf(this)"></div>
  </div>
</div>

<header class="top" id="top">
  <img class="logo" src="https://raw.githubusercontent.com/liraluis60-sketch/Bonsai-Sushi/refs/heads/main/Imagenes/logo%20bonsai.png" alt="Bonsai" data-f="e" onerror="lf(this)" onclick="go('hero')">
  <button class="pill" data-a="cart"><span>Mi pedido</span><span class="n" id="pN">0</span></button>
</header>

<main class="wrapper">
  <section class="hero" id="hero">
    <div class="hi">Bienvenido a</div>
    <img class="hl" src="https://raw.githubusercontent.com/liraluis60-sketch/Bonsai-Sushi/refs/heads/main/Imagenes/logo%20bonsai%20letra.png" alt="Bonsai Sushi" data-f="t" onerror="lf(this)">
    <h1>Bonsai <span>Sushi</span></h1>
    <div class="chips"><span>🛵 <b>Delivery</b></span><span>🥡 <b>Pick-up</b></span><span>🍣 Hecho al momento</span></div>
  </section>

  <section class="sec" id="promos">
    <div class="sec-h"><h2>Promociones</h2></div>
    <div class="hs" id="promoRow"></div>
  </section>

  <section class="sec" id="cats">
    <div class="sec-h"><h2>Categorías</h2></div>
    <div class="cats" id="catRow"></div>
  </section>

  <section class="sec" id="top-sell">
    <div class="sec-h"><h2>Lo más pedido</h2></div>
    <div class="hs sq" id="topRow"></div>
  </section>

  <section id="menu">
    <div class="menu-h"><h2>Menú</h2><p>Toca un plato para personalizarlo</p></div>
    <div class="tabs" id="tabs"></div>
    <div class="list grid-anim" id="grid"></div>
  </section>

  <footer class="foot" id="footer">
    <a class="big-btn" href="https://wa.me/584125242614" target="_blank" rel="noopener">💬 Pedir por WhatsApp</a>
    <div class="pays"><span>Pago Móvil</span><span>Zelle</span><span>Binance Pay</span><span>Transferencia</span></div>
    <small>© <span id="yr"></span> Bonsai Sushi</small>
  </footer>
</main>

<nav class="tb" id="tb">
  <button class="on" data-a="go" data-t="hero"><i>🏠</i>Inicio</button>
  <button data-a="go" data-t="promos"><i>🔥</i>Promos</button>
  <button data-a="go" data-t="menu"><i>📋</i>Menú</button>
  <button data-a="cart"><i>🛍️</i>Pedido<span class="dot" id="dot">0</span></button>
  <button data-a="go" data-t="footer"><i>💬</i>Contacto</button>
</nav>

<!-- Hoja de producto -->
<div class="wrap" id="sPV" data-wrap>
  <div class="sheet">
    <div class="grab"></div>
    <div class="sh-top"><h3>Personaliza</h3><button class="close" data-a="close">✕</button></div>
    <div class="sh-body">
      <div class="pv-img" id="pvMedia"></div>
      <div class="pv-name" id="pvName"></div>
      <p class="pv-desc" id="pvDesc"></p>
      <div class="pv-price" id="pvPrice"></div>
    </div>
    <div class="sh-foot">
      <div class="row2">
        <div class="qty"><button data-a="pvq" data-d="-1">−</button><span id="pvQty">1</span><button data-a="pvq" data-d="1">+</button></div>
        <button class="btn" data-a="pvAdd">Agregar · <span id="pvTot">$0</span></button>
      </div>
    </div>
  </div>
</div>

<!-- Carrito -->
<div class="wrap" id="sCart" data-wrap>
  <div class="sheet">
    <div class="grab"></div>
    <div class="sh-top"><h3>Mi pedido</h3><button class="close" data-a="close">✕</button></div>
    <div class="sh-body" id="cItems"></div>
    <div class="sh-foot">
      <div class="sum"><span>Total</span><b id="cTotal">$0</b></div>
      <button class="btn" id="checkoutBtn" data-a="checkout">Continuar</button>
    </div>
  </div>
</div>

<!-- Checkout -->
<div class="wrap" id="sCK" data-wrap>
  <div class="sheet">
    <div class="grab"></div>
    <div class="sh-top"><h3>Confirmar pedido</h3><button class="close" data-a="close">✕</button></div>
    <div class="sh-body">
      <div class="seg"><button class="on" data-a="mode" data-m="Delivery">🛵 Delivery</button><button data-a="mode" data-m="Pick-up">🥡 Pick-up</button></div>
      <div class="field"><label for="cName">Tu nombre</label><input id="cName" placeholder="Ej: Ana"></div>
      <div class="sumbox" id="sumBox"></div>
    </div>
    <div class="sh-foot"><button class="btn wa" data-a="send">Enviar pedido por WhatsApp</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CATS=[
  {k:'entradas',n:'Entradas',e:'🥟'},{k:'combo',n:'Combos',e:'🍱'},{k:'rolls',n:'Rolls',e:'🍣'},
  {k:'ramen',n:'Ramen',e:'🍜'},{k:'infantil',n:'Infantil',e:'🧒'},{k:'bebidas',n:'Bebidas',e:'🥤'}
];
const P={
  entradas:[
    {id:1,n:'Tempura Crunch Roll',d:'Roll empanizado crujiente con relleno de langostino y queso crema',p:10,i:'entrada1.jpg',e:'🍤'},
    {id:2,n:'Salmón Deluxe',d:'Roll fresco con capa de salmón, salsa especial y topping crocante',p:12,i:'entrada2.jpg',e:'🍣'},
    {id:3,n:'Ebi Fry Roll',d:'Langostino empanizado con queso crema y salsa unagi',p:11,i:'entrada3.jpg',e:'🦐'}],
  combo:[
    {id:4,n:'Bonsai Clásico',d:'8 piezas: 4 nigiri de salmón y 4 rolls especiales',p:28,i:'sushi1.jpg',e:'🍱'},
    {id:5,n:'Bonsai Premium',d:'12 piezas de autor: atún, salmón, aguacate y salsas especiales',p:35,i:'sushi2.jpg',e:'👑'},
    {id:6,n:'Bonsai Dragón',d:'10 piezas con anguila, aguacate y salsa unagi caramelizada',p:32,i:'sushi3.jpg',e:'🐉'}],
  rolls:[
    {id:7,n:'Sake Maki Especial',d:'Roll de salmón fresco con sésamo y pepino',p:12,i:'rolls1.jpg',e:'🐟'},
    {id:8,n:'Unagi Supreme',d:'Roll individual con anguila, aguacate y topping especial',p:14,i:'rolls2.jpg',e:'🍙'},
    {id:9,n:'Rainbow Trio',d:'Tres rolls con variedad de pescados frescos y queso crema',p:13,i:'rolls3.jpg',e:'🌈'}],
  ramen:[
    {id:10,n:'Tonkotsu Tradicional',d:'Caldo de cerdo 12 horas, chashu, huevo mollet y cebollín',p:16,i:'ramen1.jpg',e:'🍜'},
    {id:11,n:'Ramen Picante',d:'Caldo especiado, carne de res, huevo y verduras frescas',p:15,i:'ramen2.jpg',e:'🌶️'},
    {id:12,n:'Miso Ramen',d:'Caldo miso, narutomaki, chashu y huevo a la perfección',p:14,i:'ramen3.jpg',e:'🥣'}],
  infantil:[
    {id:13,n:'Mini Crunch',d:'Roll empanizado pequeño con pepino y queso, ideal para niños',p:8,i:'niño1.jpg',e:'🍘'},
    {id:14,n:'Ebi Kids',d:'Roll de langostino empanizado con aguacate, 6 piezas',p:9,i:'niño2.jpg',e:'🦐'},
    {id:15,n:'Salmón Kids',d:'Roll fresco de salmón con pepino, ideal para iniciar',p:10,i:'niño3.jpg',e:'🐠'}],
  bebidas:[
    {id:16,n:'Pepsi',d:'Refresco Pepsi 350ml bien fría',p:2,i:'bebida.jpg',e:'🥤'},
    {id:17,n:'Poppi Wild Berry',d:'Sabor berries con bajo contenido de azúcar',p:3,i:'bebida2.jpg',e:'🍓'},
    {id:18,n:'Coca-Cola',d:'Refresco Coca-Cola 350ml bien fría',p:2,i:'bebida3.jpg',e:'🥤'}]
};
/* Promociones: edita textos y productos aquí */
const PROMOS=[
  {id:4,tag:'🔥 Lo más pedido',t:'Bonsai Clásico',s:'El combo favorito de la casa',cls:'',big:'🍱'},
  {id:9,tag:'🌈 Para compartir',t:'Rainbow Trio',s:'Tres rolls, tres sabores',cls:'g',big:'🌈'},
  {id:13,tag:'🧒 Para los peques',t:'Mini Crunch',s:'Pequeños, crujientes y deliciosos',cls:'k',big:'🍘'}
];
const TOP=[2,4,10,7,14,16];

const byId=Object.fromEntries(Object.values(P).flat().map(p=>[p.id,p]));
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const money=n=>'$'+n;
const cart={}, cq={};
let curCat='entradas', pvId=null, pvQty=1, mode='Delivery';
const IMGSRC=i=>IMG+encodeURI(i);

function lines(){return Object.entries(cart).map(([id,q])=>({...byId[id],q}))}
function totalOf(items){return items.reduce((s,i)=>s+i.q*i.p,0)}
function go(id){document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'})}
function toast(msg){const t=$('#toast');t.innerHTML=`<b>✓</b>${msg}`;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2000)}
function bump(el){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}
function open(id){document.getElementById(id).classList.add('open');document.body.classList.add('lock')}
function closeAll(){$$('.wrap.open').forEach(w=>w.classList.remove('open'));document.body.classList.remove('lock')}

function thumb(p,big){return `<div class="thumb"><img src="${IMGSRC(p.i)}" alt="" loading="lazy" onerror="this.remove()"><span class="em">${p.e}</span></div>`}

function renderPromos(){
  $('#promoRow').innerHTML=PROMOS.map(pr=>{const p=byId[pr.id];return `
    <div class="promo ${pr.cls}" data-a="pv" data-id="${p.id}">
      <span class="big">${pr.big}</span>
      <div><span class="tag">${pr.tag}</span><h3>${pr.t}</h3><p>${pr.s}</p></div>
      <div class="ft"><span class="pr">${money(p.p)}</span><span class="go">Pedir</span></div>
    </div>`}).join('');
}
function renderCats(){
  $('#catRow').innerHTML=CATS.map(c=>`<button class="cat" data-a="cat" data-c="${c.k}"><i>${c.e}</i>${c.n}</button>`).join('');
}
function renderTop(){
  $('#topRow').innerHTML=TOP.map((id,idx)=>{const p=byId[id];return `
    <div class="item" style="--i:${idx}" data-a="pv" data-id="${p.id}">
      ${thumb(p)}<div class="ib"><h3>${p.n}</h3><div class="ft2"><span class="price">${money(p.p)}</span><button class="plus" data-a="add1" data-id="${p.id}">+</button></div></div>
    </div>`}).join('');
}
function renderTabs(){
  $('#tabs').innerHTML=CATS.map(c=>`<button class="tab ${c.k===curCat?'on':''}" data-a="tab" data-c="${c.k}">${c.n}</button>`).join('');
}
function renderGrid(){
  $('#grid').innerHTML=(P[curCat]||[]).map((p,idx)=>`
    <div class="item" style="--i:${idx}" data-a="pv" data-id="${p.id}">
      ${thumb(p)}
      <div class="ib"><h3>${p.n}</h3><p>${p.d}</p>
        <div class="ft2"><span class="price">${money(p.p)}</span><button class="plus" data-a="add1" data-id="${p.id}" aria-label="Agregar">+</button></div>
      </div>
    </div>`).join('');
}
function renderCart(){
  const items=lines(), n=items.reduce((s,i)=>s+i.q,0), t=totalOf(items);
  $('#pN').textContent=n; $('#dot').textContent=n; $('#dot').classList.toggle('show',n>0);
  $('#cTotal').textContent=money(t);
  $('#checkoutBtn').disabled=!items.length;
  $('#cItems').innerHTML=items.length? items.map(i=>`
    <div class="ci">${thumb(i)}
      <div class="info"><b>${i.n}</b><small>${money(i.p)} c/u</small></div>
      <div class="qty"><button data-a="cartQ" data-id="${i.id}" data-d="-1">−</button><span>${i.q}</span><button data-a="cartQ" data-id="${i.id}" data-d="1">+</button></div>
    </div>`).join('')
  : `<div class="empty"><i>🍣</i>Tu pedido está vacío</div>`;
}

function addToCart(id,q){cart[id]=(cart[id]||0)+q;renderCart();bump($('.pill'))}
function openPV(id){
  const p=byId[id]; if(!p) return;
  pvId=id; pvQty=1;
  $('#pvMedia').innerHTML=`<img src="${IMGSRC(p.i)}" alt="" onerror="this.remove()"><span class="em">${p.e}</span>`;
  $('#pvName').textContent=p.n; $('#pvDesc').textContent=p.d;
  $('#pvPrice').textContent=money(p.p); $('#pvQty').textContent=1; $('#pvTot').textContent=money(p.p);
  open('sPV');
}
function openCheckout(){
  const items=lines(), t=totalOf(items);
  $('#sumBox').innerHTML=items.map(i=>`<div><span>${i.n} ×${i.q}</span><span>${money(i.p*i.q)}</span></div>`).join('')+`<div class="t"><span>Total</span><span>${money(t)}</span></div>`;
  open('sCK');
}
function sendWA(){
  const items=lines(); if(!items.length) return;
  const name=$('#cName').value.trim(), t=totalOf(items);
  let m=`*BONSAI SUSHI - Nuevo Pedido*\n\n${name?`Hola, soy *${name}*`:'Hola!'}\n*Modalidad:* ${mode}\n\nQuisiera ordenar:\n\n`;
  items.forEach(i=>m+=`• ${i.n} x${i.q} - ${money(i.p*i.q)}\n`);
  m+=`\n*Total: ${money(t)}*\n\n¿Podrían enviarme los métodos de pago disponibles?`;
  window.open(`https://wa.me/584125242614?text=${encodeURIComponent(m)}`,'_blank');
  Object.keys(cart).forEach(k=>delete cart[k]);
  renderCart(); closeAll(); $('#cName').value='';
  toast('Pedido enviado');
}

const A={
  cart:()=>{renderCart();open('sCart')},
  close:closeAll,
  go:(_,el)=>{ $$('#tb button').forEach(b=>b.classList.toggle('on',b===el)); go(el.dataset.t) },
  cat:(_,el)=>{ curCat=el.dataset.c; renderTabs(); renderGrid(); go('menu') },
  tab:(_,el)=>{
    if(el.dataset.c===curCat) return;
    curCat=el.dataset.c; renderTabs();
    const g=$('#grid'); g.classList.add('out');
    setTimeout(()=>{renderGrid(); g.classList.remove('out')},250);
  },
  pv:(id)=>openPV(id),
  add1:(id,el)=>{
    addToCart(id,1); toast(`${byId[id].n} agregado`);
    el.classList.add('ok'); el.textContent='✓';
    setTimeout(()=>{el.classList.remove('ok');el.textContent='+'},700);
  },
  pvq:(_,el)=>{pvQty=Math.min(20,Math.max(1,pvQty+ +el.dataset.d));$('#pvQty').textContent=pvQty;$('#pvTot').textContent=money(byId[pvId].p*pvQty)},
  pvAdd:()=>{addToCart(pvId,pvQty);toast(`${byId[pvId].n} agregado`);closeAll()},
  cartQ:(id,el)=>{cart[id]=(cart[id]||0)+ +el.dataset.d; if(cart[id]<1) delete cart[id]; renderCart()},
  checkout:()=>{closeAll();setTimeout(openCheckout,250)},
  mode:(_,el)=>{mode=el.dataset.m;$$('.seg button').forEach(b=>b.classList.toggle('on',b===el))},
  send:sendWA
};
document.addEventListener('click',e=>{
  if(e.target.matches('[data-wrap]')) return closeAll();
  const el=e.target.closest('[data-a]'); if(!el) return;
  const id=el.dataset.id?+el.dataset.id:null;
  A[el.dataset.a]?.(id,el);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
window.addEventListener('scroll',()=>$('#top').classList.toggle('s',scrollY>20),{passive:true});

/* Scroll-spy para la barra inferior */
const secs={hero:'hero',promos:'promos',menu:'menu',footer:'footer'};
const spy=new IntersectionObserver(es=>es.forEach(en=>{
  if(!en.isIntersecting) return;
  const key=Object.keys(secs).find(k=>secs[k]===en.target.id);
  $$('#tb button').forEach(b=>b.classList.toggle('on',b.dataset.t===key));
}),{rootMargin:'-45% 0px -50% 0px'});
Object.values(secs).forEach(id=>{const el=document.getElementById(id); el&&spy.observe(el)});

const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target)}}),{threshold:.12});
$$('.rv').forEach(el=>io.observe(el));

(function intro(){
  const s=$('#splash'), hide=()=>s.classList.add('done');
  s.addEventListener('click',hide);
  setTimeout(hide,2400);
})();

$('#yr').textContent=new Date().getFullYear();
renderPromos(); renderCats(); renderTop(); renderTabs(); renderGrid(); renderCart();
</script>
</body>
</html>
