<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bonsai Sushi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
const IMG='https://raw.githubusercontent.com/liraluis60-sketch/Bonsai-Sushi/refs/heads/main/Imagenes/';
const EMB=`<span class="emb"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="49" fill="#120806"/><circle cx="50" cy="50" r="43" fill="#B3182E"/><circle cx="50" cy="50" r="35" fill="#F5C400"/><path d="M30 46c8-6 18-8 26-4 6-6 10-14 6-22-4-4-10 0-10 4 0-4-6-8-10-2-4 6 4 10 4 14-10-2-18 4-22 10z M44 52c-1 8-2 16-6 22h8c4-6 6-12 6-18z M52 52c2 8 4 14 8 20h-8c-4-6-6-12-6-18z" fill="#120806"/></svg></span>`;
function lf(el){el.outerHTML=el.dataset.f==='e'?EMB:'<span class="fb">BONSAI <b>SUSHI</b></span>'}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#070707;--s1:#121212;--s2:#1B1B1D;--s3:#26262A;--red:#C8102E;--red2:#E0283F;--gold:#F5C400;--gold2:#FFD84A;
  --txt:#F5F5F7;--mut:#8E8E93;--line:rgba(255,255,255,.08);
  --ease:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.34,1.45,.64,1);
}
html{scroll-behavior:smooth}
body{font-family:Inter,-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:transform .25s var(--ease),background .3s,color .3s,opacity .3s}
button:active{transform:scale(.95)}
button:disabled{opacity:.35;transform:none;cursor:not-allowed}
img{display:block;max-width:100%}
svg{display:block;width:16px;height:16px;flex-shrink:0}
.wrapper{max-width:1100px;margin:0 auto;position:relative}
.emb{display:block;width:100%;height:100%}
.emb svg{width:100%;height:100%}
.fb{font-weight:800;letter-spacing:.12em;font-size:15px}
.fb b{color:var(--gold)}
.sec{padding:36px 0 0;position:relative}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 20px;margin-bottom:16px}
.sec-h h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.sec-h small{color:var(--mut);font-size:13px}
.hs{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 20px 8px;scrollbar-width:none;scroll-padding:0 20px}
.hs::-webkit-scrollbar{display:none}

/* ===== Splash ===== */
#splash{position:fixed;inset:0;z-index:9999;background:#000;display:grid;place-items:center;transition:opacity .7s var(--ease),transform .7s var(--ease),visibility .7s}
#splash.done{opacity:0;visibility:hidden;transform:scale(1.06)}
.sp-logo{width:150px;height:150px;margin:0 auto;border-radius:50%;position:relative;animation:logoIn 1.1s var(--spring) both}
.sp-logo::after{content:'';position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(245,196,0,.5);animation:ring 1.6s .6s var(--ease) both}
.sp-word{text-align:center;margin-top:26px;font-size:20px;font-weight:700;letter-spacing:.42em;padding-left:.42em;animation:up .9s .5s var(--ease) both}

/* ===== Top ===== */
.top{position:fixed;top:0;left:0;right:0;z-index:100;padding:env(safe-area-inset-top,0px) 16px 0;height:calc(58px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;justify-content:space-between;background:rgba(7,7,7,.55);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border-bottom:.5px solid transparent;transition:border-color .3s,background .3s}
.top.s{border-color:var(--line);background:rgba(7,7,7,.86)}
.top .logo{width:38px;height:38px;cursor:pointer;transition:transform .6s var(--spring)}
.top .logo:hover{transform:rotate(-12deg)}
.top .fb{font-size:13px}
.pill{display:flex;align-items:center;gap:10px;height:40px;padding:0 6px 0 16px;border-radius:99px;background:var(--red);font-weight:700;font-size:14px;box-shadow:0 8px 20px -8px rgba(200,16,46,.9)}
.pill .n{min-width:28px;height:28px;border-radius:99px;background:#fff;color:var(--red);display:grid;place-items:center;font-size:13px;font-weight:800;padding:0 7px}
.bump{animation:bump .5s var(--spring)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}

/* ===== Hero ===== */
.hero{position:relative;overflow:hidden;padding:calc(58px + env(safe-area-inset-top,0px) + 30px) 20px 10px;text-align:center}
.hero::before,.hero::after{content:'';position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none;z-index:0}
.hero::before{width:300px;height:300px;background:rgba(200,16,46,.35);top:-80px;left:-80px;animation:blob 9s ease-in-out infinite}
.hero::after{width:260px;height:260px;background:rgba(245,196,0,.18);bottom:-60px;right:-60px;animation:blob 11s ease-in-out infinite reverse}
.hero>*{position:relative;z-index:1}
.hi{color:var(--mut);font-size:14px;font-weight:500;animation:up .8s var(--ease) both}
.hl{width:min(300px,78vw);height:auto;margin:6px auto 4px;animation:up .9s .1s var(--ease) both;filter:drop-shadow(0 10px 30px rgba(200,16,46,.25))}
.hero h1{font-size:40px;font-weight:800;letter-spacing:-.02em;margin:4px 0 14px;animation:up .9s .15s var(--ease) both}
.hero h1 span{color:var(--gold)}
.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;animation:up .9s .25s var(--ease) both}
.chips span{font-size:12px;font-weight:600;padding:7px 12px;border-radius:99px;background:rgba(27,27,29,.8);border:.5px solid var(--line)}
.chips span b{color:var(--gold)}
@keyframes blob{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,20px) scale(1.12)}}

/* ===== Promos ===== */
.promo{flex:0 0 86%;max-width:380px;scroll-snap-align:center;border-radius:28px;padding:22px;min-height:240px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(140deg,var(--red) 0%,#4a0713 100%);box-shadow:0 22px 44px -20px rgba(200,16,46,.75);isolation:isolate}
.promo::before{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(-120%);animation:shine 4.5s ease-in-out infinite;z-index:-1}
.promo.g{background:linear-gradient(140deg,#F5C400 0%,#9C7600 100%);color:#111}
.promo.k{background:linear-gradient(140deg,#2b2b30 0%,#0b0b0c 100%);box-shadow:0 22px 44px -20px rgba(0,0,0,.9)}
.promo.n{background:linear-gradient(140deg,#3a0a12 0%,#120305 100%)}
.promo .food + .food-em{display:none}
.promo .ring{position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.18);z-index:-1}
.promo .ring.a{width:200px;height:200px;right:-70px;top:-70px}
.promo .ring.b{width:130px;height:130px;right:-20px;top:-20px;border-color:rgba(255,255,255,.1)}
.promo .food{position:absolute;right:-6px;bottom:44px;width:160px;height:160px;object-fit:cover;border-radius:50%;box-shadow:0 18px 36px -10px rgba(0,0,0,.6);border:3px solid rgba(255,255,255,.14)}
.promo .food-em{position:absolute;right:14px;bottom:56px;font-size:90px;filter:drop-shadow(0 14px 20px rgba(0,0,0,.5));animation:float 4s ease-in-out infinite}
.promo .tag{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 11px;border-radius:99px;background:rgba(0,0,0,.3);backdrop-filter:blur(6px)}
.promo h3{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:16px 0 6px;max-width:60%}
.promo p{font-size:14px;opacity:.85;max-width:60%}
.promo .ft{display:flex;align-items:center;gap:12px;margin-top:18px}
.promo .pr{font-size:22px;font-weight:800}
.promo .go{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 18px;border-radius:99px;background:#fff;color:#111;font-size:13px;font-weight:700;line-height:1}
.promo .off{margin-left:auto;font-size:12px;font-weight:700;padding:6px 10px;border-radius:10px;background:rgba(0,0,0,.25)}
@keyframes shine{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
.dots{display:flex;justify-content:center;gap:7px;margin-top:14px}
.dots i{width:7px;height:7px;border-radius:99px;background:#3a3a3e;transition:width .4s var(--ease),background .3s}
.dots i.on{width:22px;background:var(--gold)}

/* ===== Lo más pedido (visual) ===== */
.hc{position:relative;flex:0 0 208px;scroll-snap-align:start;border-radius:24px;overflow:hidden;background:var(--s1);border:.5px solid var(--line);cursor:pointer;animation:up .7s var(--ease) both;animation-delay:calc(var(--i)*70ms);transition:transform .45s var(--ease)}
.hc:hover{transform:translateY(-4px)}
.hc .im{position:relative;height:200px;background:radial-gradient(circle at 40% 30%,#3a1218,#161618 70%);display:grid;place-items:center;overflow:hidden}
.hc .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.hc:hover .im img{transform:scale(1.08)}
.hc .im .em{font-size:72px;position:relative;z-index:1;filter:drop-shadow(0 10px 16px rgba(0,0,0,.5))}
.hc .im img+.em{display:none}
.rate{position:absolute;top:10px;right:10px;z-index:2;display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:99px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);font-size:12px;font-weight:700}
.rate b{color:var(--gold)}
.rate svg{width:11px;height:11px;color:var(--gold)}
.hc .bd{padding:14px}
.hc h3{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.hc .price{font-size:17px;font-weight:800;color:var(--gold)}
.plus{width:38px;height:38px;border-radius:99px;background:var(--red);color:#fff;font-size:22px;font-weight:500;display:grid;place-items:center;box-shadow:0 6px 14px -6px rgba(200,16,46,.9)}
.plus.ok{background:#30D158;font-size:16px}

/* ===== Categorías (íconos cute) ===== */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 20px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 8px 14px;border-radius:24px;background:var(--s1);border:.5px solid var(--line);font-size:13px;font-weight:700;transition:transform .45s var(--spring),background .3s,border-color .3s;overflow:hidden}
.tile:hover{background:var(--s2)}
.tile.on{border-color:var(--gold);background:var(--s2)}
.tile .ic{width:84px;height:84px;border-radius:20px;display:grid;place-items:center;font-size:44px;line-height:1;background:linear-gradient(145deg,var(--s3),var(--s1));transition:transform .6s var(--spring)}
.tile:nth-child(3n+1) .ic{background:linear-gradient(145deg,#4a0b15,#1a0608)}
.tile:nth-child(3n+2) .ic{background:linear-gradient(145deg,#4a3a00,#1a1500)}
.tile:hover .ic{transform:translateY(-4px) rotate(-4deg) scale(1.05)}
.tile small{font-size:11px;color:var(--mut);font-weight:500;margin-top:-6px}
@media(min-width:760px){.cats{grid-template-columns:repeat(6,1fr)}.hero h1{font-size:56px}}

/* ===== Panel de categoría (desbloqueo) ===== */
.panel{margin:20px 20px 0;padding:22px 18px;border-radius:28px;background:linear-gradient(180deg,#1b1212,#111 60%);border:.5px solid var(--line);display:none;animation:up .6s var(--ease) both}
.panel.show{display:block}
.pn-h{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.pn-h .ic{width:56px;height:56px;flex-shrink:0;border-radius:16px;display:grid;place-items:center;font-size:30px;line-height:1;background:var(--s3)}
.pn-h h3{font-size:22px;font-weight:800;letter-spacing:-.02em;flex:1}
.pn-h .close{width:32px;height:32px;border-radius:99px;background:var(--s3);color:var(--mut);font-size:15px;display:grid;place-items:center}
.pn-blurb{color:var(--mut);font-size:14px;margin:4px 0 18px;padding-bottom:16px;border-bottom:.5px solid var(--line)}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:760px){.pgrid{grid-template-columns:repeat(4,1fr)}}
.pc{position:relative;border-radius:20px;overflow:hidden;background:var(--s2);border:.5px solid var(--line);cursor:pointer;transition:transform .4s var(--ease);animation:up .6s var(--ease) both;animation-delay:calc(var(--d)*140ms + 200ms)}
.pc:hover{transform:translateY(-3px)}
.pc .im{position:relative;height:118px;display:grid;place-items:center;background:radial-gradient(circle at 40% 30%,#3a1218,#161618 70%);overflow:hidden}
.pc .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc .im .em{font-size:44px;position:relative;z-index:1}
.pc .im img+.em{display:none}
.pc .lk{position:absolute;inset:0;z-index:3;display:grid;place-items:center;background:rgba(7,7,7,.72);backdrop-filter:blur(5px);transition:opacity .5s var(--ease),visibility .5s}
.pc .lk svg{width:30px;height:30px;transition:transform .5s var(--spring)}
.pc.un .lk{opacity:0;visibility:hidden}
.pc.un .lk svg{transform:scale(1.4) rotate(-20deg)}
.pc .bd{padding:11px 12px 12px}
.pc h4{font-size:14px;font-weight:700;line-height:1.2;min-height:34px}
.pc .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.pc .price{font-weight:800;color:var(--gold);font-size:15px}
.pc .plus{width:32px;height:32px;font-size:19px}

/* ===== Hojas ===== */
.wrap{position:fixed;inset:0;z-index:500;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
.wrap.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:560px;max-height:92svh;display:flex;flex-direction:column;overflow:hidden;background:#161618;border-radius:34px 34px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(105%);transition:transform .55s var(--ease);box-shadow:0 -10px 60px rgba(0,0,0,.6)}
.sheet.half{max-height:62svh}
.wrap.open .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:9px;background:#3a3a3e;margin:8px auto 2px;flex-shrink:0}
.sh-top{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 12px}
.sh-top h3{font-size:19px;font-weight:700}
.close{width:32px;height:32px;border-radius:99px;background:var(--s3);color:var(--mut);font-size:15px;display:grid;place-items:center}
.sh-body{overflow-y:auto;padding:0 20px 16px;flex:1}
.sh-foot{padding:14px 20px 20px;border-top:.5px solid var(--line)}
@media(min-width:760px){.wrap{align-items:center}.sheet{border-radius:30px;transform:translateY(24px) scale(.96);opacity:0;transition:transform .55s var(--spring),opacity .4s}.wrap.open .sheet{transform:none;opacity:1}.grab{display:none}}

/* Ficha premium */
.dt{overflow-y:auto;flex:1;padding-bottom:10px}
.dt-hero{position:relative;height:400px;margin:-10px 0 0;background:radial-gradient(circle at 50% 40%,#5a1a10,#1a0c08 70%);display:grid;place-items:center;overflow:hidden}
.dt-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:fade .8s var(--ease)}
.dt-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,#161618)}
.dt-hero .em{font-size:130px;position:relative;z-index:1;animation:pop .9s var(--spring) both;filter:drop-shadow(0 18px 30px rgba(0,0,0,.5))}
.dt-hero img+.em{display:none}
.dt-btns{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:14px;right:14px;display:flex;justify-content:space-between;z-index:5}
.glass{width:40px;height:40px;border-radius:99px;background:rgba(0,0,0,.45);backdrop-filter:blur(10px);display:grid;place-items:center;font-size:16px;color:#fff}
.glass.on{color:var(--red2)}
.dt-body{position:relative;z-index:2;padding:0 24px;margin-top:-90px}
.dt-body::before{content:'♛  PREMIUM';display:block;font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--gold);margin-bottom:10px}
.dt-title{display:flex;flex-direction:column;gap:4px}
.dt-title h2{font-size:50px;font-weight:300;letter-spacing:-.03em;line-height:1}
.dt-title .price{font-size:20px;font-weight:600;color:var(--mut);white-space:nowrap}

.dt-meta{display:flex;align-items:center;gap:8px;margin:8px 0 18px;font-size:13px;color:var(--mut)}
.dt-meta b{color:#fff}
.star{width:14px;height:14px;color:var(--gold)}
.chipsrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.feat{background:var(--s2);border-radius:18px;padding:12px 8px;text-align:center;border:.5px solid var(--line)}
.feat svg{width:30px;height:30px;margin:0 auto 6px}
.feat b{display:block;font-size:12px;font-weight:700}
.feat small{font-size:11px;color:var(--mut)}
.dt-h{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:18px 0 8px}
.dt-desc{font-size:17px;color:#e2e2e6;line-height:1.65;font-weight:300}
.sizes{display:flex;gap:10px}
.sizes button{flex:1;height:52px;border-radius:16px;background:var(--s2);border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.sizes button small{font-size:11px;color:var(--mut);font-weight:500}
.sizes button.on{border-color:var(--gold);background:rgba(245,196,0,.08);color:var(--gold)}
.sizes button.on small{color:var(--gold2)}
.buy{display:flex;align-items:center;gap:14px}
.buy .qty{flex-shrink:0}
.qty{display:flex;align-items:center;background:var(--s3);border-radius:99px;height:52px}
.qty button{width:44px;height:52px;font-size:20px;font-weight:500;display:grid;place-items:center}
.qty span{min-width:26px;text-align:center;font-weight:700;font-size:16px}
.btn{height:56px;flex:1;border-radius:99px;background:#fff;color:#111;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 14px 26px -12px rgba(255,255,255,.35)}
.btn:hover:not(:disabled){filter:brightness(1.07)}
.btn.red{background:var(--red);color:#fff;box-shadow:0 14px 26px -12px rgba(200,16,46,.9)}
.btn.wa{background:#30D158;color:#fff;box-shadow:0 14px 26px -12px rgba(48,209,88,.8)}
.btn.wa:hover:not(:disabled){background:#2bc24f}
.bar-cart{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.bar-cart b{font-size:24px;font-weight:800;color:var(--gold)}

/* Carrito compacto */
.ci{display:flex;align-items:center;gap:12px;padding:10px;margin-bottom:10px;background:var(--s2);border-radius:18px}
.ci .mini{width:56px;height:56px;border-radius:14px;overflow:hidden;position:relative;display:grid;place-items:center;background:radial-gradient(circle,#3a1218,#161618);flex-shrink:0}
.ci .mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ci .mini .em{font-size:26px;position:relative}
.ci .mini img+.em{display:none}
.ci .info{flex:1;min-width:0}
.ci .info b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .info small{color:var(--mut);font-size:12px}
.ci .qty{height:34px}
.ci .qty button{width:32px;height:34px;font-size:17px}
.ci .qty span{min-width:20px;font-size:13px}
.ci .tot{font-weight:800;min-width:48px;text-align:right;font-size:14px;color:var(--gold)}
.sum{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sum span{color:var(--mut);font-size:14px}
.sum b{font-size:24px;font-weight:800;color:var(--gold)}
.seg{display:flex;background:var(--s3);border-radius:12px;padding:3px;margin-bottom:18px}
.seg button{flex:1;height:38px;border-radius:9px;font-size:14px;font-weight:600;color:var(--mut)}
.seg button.on{background:#5a5a60;color:#fff}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--mut);margin-bottom:8px;font-weight:500}
.field input{width:100%;height:50px;padding:0 16px;border-radius:14px;background:var(--s2);border:0;color:var(--txt);font:inherit;font-size:16px;outline:none;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .3s}
.field input:focus{box-shadow:inset 0 0 0 2px var(--gold)}
.sumbox{background:var(--s2);border-radius:16px;padding:14px 16px}
.sumbox div{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin-bottom:8px}
.sumbox .t{color:var(--txt);font-weight:700;margin:0;padding-top:8px;border-top:.5px solid var(--line)}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}
.empty svg{width:70px;height:70px;margin:0 auto 10px;animation:bob 2.4s ease-in-out infinite}

/* Toast */
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;z-index:900;translate:-50%;transform:translateY(-160%);background:#000;color:#fff;border-radius:99px;padding:12px 22px 12px 14px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:0 12px 30px rgba(0,0,0,.6);transition:transform .6s var(--spring);white-space:nowrap}
.toast.show{transform:translateY(0)}
.toast b{width:24px;height:24px;border-radius:99px;background:#30D158;display:grid;place-items:center;font-size:13px}


.foot{padding:50px 20px 30px;text-align:center}
.foot .big{width:100%;max-width:420px;height:56px;border-radius:18px;background:#30D158;color:#fff;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.foot .pays{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:26px 0}
.foot .pays span{font-size:12px;padding:8px 12px;border-radius:99px;background:var(--s1);border:.5px solid var(--line);color:var(--mut)}
.foot small{color:#56565c;font-size:12px}

.cart-empty{display:block;font-size:56px;margin-bottom:10px;animation:bob 2.4s ease-in-out infinite}
@media(min-width:900px){
  .wrapper{max-width:1200px;padding:0 32px}
  .hero{width:100vw;margin-left:calc(50% - 50vw);padding-left:clamp(32px,6vw,96px);padding-right:clamp(32px,6vw,96px);min-height:620px;display:flex;flex-direction:column;justify-content:center;border-radius:0}
  .sec-h,.cats{padding-left:0;padding-right:0}
  .panel{margin-left:0;margin-right:0}
  .foot{padding-left:0;padding-right:0}
  .hs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;overflow:visible;padding:4px 0 8px}
  .hc{min-width:0}
  .promo{flex:none;max-width:none;min-height:260px}
  #topRow{grid-template-columns:repeat(6,1fr)}
  .hc{flex:none}
  #dots{display:none}
  #sCart{justify-content:flex-end}
  #sCart .sheet{max-width:420px;height:100svh;max-height:100svh;border-radius:0;border-left:.5px solid var(--line);transform:translateX(105%);opacity:1}
  #sCart.open .sheet{transform:none}
}
@keyframes logoIn{0%{transform:scale(.3) rotate(-60deg);opacity:0}70%{transform:scale(1.06) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes ring{0%{transform:scale(.6);opacity:0}50%{opacity:1}100%{transform:scale(1.25);opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

}
function renderTop(){
  $('#topRow').innerHTML=TOP.map((id,idx)=>{const p=byId[id];return `
    <div class="hc" style="--i:${idx}" data-a="pv" data-id="${p.id}">
      ${media(p)}<span class="rate">${ico('i-star')}<b>${p.r}</b></span>
      <div class="bd"><h3>${p.n}</h3><div class="row"><span class="price">${money(p.p)}</span><button class="plus" data-a="add1" data-id="${p.id}">+</button></div></div>
    </div>`}).join('');
}
function renderCats(){
  $('#catRow').innerHTML=CATS.map(c=>`
    <button class="tile ${c.k===curCat?'on':''}" data-a="cat" data-c="${c.k}">
      <span class="ic">${EMO[c.k]}</span>${c.n}<small>${P[c.k].length} platos</small>
    </button>`).join('');
}
/* Panel de categoría con desbloqueo progresivo */
function openCat(key){
  if(curCat===key){closePanel();return}
  curCat=key; renderCats();
  const c=CATS.find(x=>x.k===key), items=P[key];
  const pn=$('#panel');
  pn.innerHTML=`
    <div class="pn-h"><span class="ic">${EMO[key]}</span><h3>${c.n}</h3><button class="close" data-a="closeCat">✕</button></div>
    <p class="pn-blurb">${c.b}</p>
    <div class="pgrid">${items.map((p,idx)=>`
      <div class="pc" style="--d:${idx}" data-a="pv" data-id="${p.id}">
        ${media(p)}
        <div class="lk"><svg><use href="#i-lock"/></svg></div>
        <div class="bd"><h4>${p.n}</h4>
          <div class="row"><span class="price">${money(p.p)}</span><button class="plus" data-a="add1" data-id="${p.id}">+</button></div>
        </div>
      </div>`).join('')}</div>`;
  pn.classList.remove('show'); void pn.offsetWidth; pn.classList.add('show');
  /* desbloqueo: cada plato se abre con un pequeño retraso */
  items.forEach((_,idx)=>setTimeout(()=>{const el=pn.querySelectorAll('.pc')[idx]; el&&el.classList.add('un')},400+idx*260));
  setTimeout(()=>pn.scrollIntoView({behavior:'smooth',block:'nearest'}),80);
}
function closePanel(){curCat=null;$('#panel').classList.remove('show');renderCats()}

function renderCart(){
  const items=lines(), n=items.reduce((s,i)=>s+i.q,0), t=totalOf(items);
  $('#pN').textContent=n;
  $('#cTotal').textContent=money(t);
  $('#checkoutBtn').disabled=!items.length;
  $('#cItems').innerHTML=items.length? items.map(i=>{const p=byId[i.id];const label=i.size?` · ${i.size}`:'';return `
    <div class="ci">${media(p,'mini')}
      <div class="info"><b>${p.n}${label}</b><small>${money(unitPrice(p,i.m))} c/u</small></div>
      <div class="qty"><button data-a="cartQ" data-k="${i.k}" data-d="-1">−</button><span>${i.q}</span><button data-a="cartQ" data-k="${i.k}" data-d="1">+</button></div>
    </div>`}).join('')
  : `<div class="empty"><span class="cart-empty">🛒</span><p>Tu carrito está vacío</p></div>`;
}

function addToCart(id,q,m=1,size=''){
  const k=`${id}|${size}`;
  cart[k]=cart[k]||{k,id,m,size,q:0};
  cart[k].q+=q; renderCart(); bump($('.pill'));
}

/* Ficha premium */
function openPV(id){
  const p=byId[id]; if(!p) return;
  pv=p; pvQty=1; pvSize=0;
  const sized=!p.nosize;
  $('#dtBody').innerHTML=`
    <div class="dt-hero">
      ${p.i?`<img src="${IMGSRC(p.i)}" alt="${p.n}" onerror="this.remove()">`:''}<span class="em">${p.e}</span>
      <div class="dt-btns"><button class="glass" data-a="closePV">←</button><button class="glass" id="favBtn" data-a="fav">${fav.has(p.id)?'♥':'♡'}</button></div>
    </div>
    <div class="dt-body">
      <div class="dt-title"><h2>${p.n}</h2><span class="price">${money(p.p)}</span></div>
      <div class="dt-meta">${ico('i-star','star')}<b>${p.r}</b> · Reseñas de clientes ${p.sp?'· Picante':''}</div>
      <div class="chipsrow">
        <div class="feat">${ico('i-clock')}<b>20–25 min</b><small>Preparación</small></div>
        <div class="feat">${ico('i-piece')}<b>Fresco</b><small>Ingredientes</small></div>
        <div class="feat">${ico(p.sp?'i-chili':'i-star')}<b>${p.sp?'Picante':'Premium'}</b><small>${p.sp?'Nivel alto':'Hecho al momento'}</small></div>
      </div>
      <div class="dt-h">Descripción</div>
      <p class="dt-desc">${p.d}</p>
      ${sized?`<div class="dt-h">Porción</div>
      <div class="sizes">${SIZES.map((s,idx)=>`<button class="${idx===0?'on':''}" data-a="size" data-idx="${idx}">${s.k}<small>${s.m===1?'Porción normal':'+60% más'}</small></button>`).join('')}</div>`:''}
    </div>`;
  $('#dtBody').scrollTop=0;
  updatePV();
  open('sPV');
}
function currentM(){return pv&&!pv.nosize?SIZES[pvSize].m:1}
function updatePV(){
  $('#pvQty').textContent=pvQty;
  $('#pvTot').textContent=money(unitPrice(pv,currentM())*pvQty);
}
function sendWA(){
  const items=lines(); if(!items.length) return;
  const name=$('#cName').value.trim(), t=totalOf(items);
  let m=`*BONSAI SUSHI - Nuevo Pedido*\n\n${name?`Hola, soy *${name}*`:'Hola!'}\n*Modalidad:* ${mode}\n\nQuisiera ordenar:\n\n`;
  items.forEach(i=>{const p=byId[i.id];m+=`• ${p.n}${i.size?` (${i.size})`:''} x${i.q} - ${money(unitPrice(p,i.m)*i.q)}\n`});
  m+=`\n*Total: ${money(t)}*\n\n¿Podrían enviarme los métodos de pago disponibles?`;
  window.open(`https://wa.me/584125242614?text=${encodeURIComponent(m)}`,'_blank');
  Object.keys(cart).forEach(k=>delete cart[k]);
  renderCart(); closeAll(); $('#cName').value='';
  toast('Pedido enviado');
}

const A={
  cart:()=>{renderCart();open('sCart')},
  close:closeAll,
  closePV:closeAll,
  closeCat:closePanel,
  cat:(_,el)=>{openCat(el.dataset.c)},
  pv:(id)=>openPV(id),
  fav:()=>{ if(!pv) return; fav.has(pv.id)?fav.delete(pv.id):fav.add(pv.id); $('#favBtn').textContent=fav.has(pv.id)?'♥':'♡'; },
  size:(_,el)=>{pvSize=+el.dataset.idx;$$('.sizes button').forEach(b=>b.classList.toggle('on',b===el));updatePV()},
  pvq:(_,el)=>{pvQty=Math.min(20,Math.max(1,pvQty+ +el.dataset.d));updatePV()},
  pvAdd:()=>{
    const m=currentM(), size=pv.nosize?'':SIZES[pvSize].k;
    addToCart(pv.id,pvQty,m,size); toast(`${pv.n} agregado`); closeAll();
  },
  add1:(id,el)=>{
    addToCart(id,1,1,''); toast(`${byId[id].n} agregado`);
    el.classList.add('ok'); el.textContent='✓';
    setTimeout(()=>{el.classList.remove('ok');el.textContent='+'},700);
  },
  cartQ:(_,el)=>{const k=el.dataset.k; cart[k].q+=+el.dataset.d; if(cart[k].q<1) delete cart[k]; renderCart()},
  checkout:()=>{closeAll();setTimeout(openCheckout,250)},
  mode:(_,el)=>{mode=el.dataset.m;$$('.seg button').forEach(b=>b.classList.toggle('on',b===el))},
  send:sendWA
};
function openCheckout(){
  const items=lines(), t=totalOf(items);
  $('#sumBox').innerHTML=items.map(i=>{const p=byId[i.id];return `<div><span>${p.n}${i.size?` (${i.size})`:''} ×${i.q}</span><span>${money(unitPrice(p,i.m)*i.q)}</span></div>`}).join('')+`<div class="t"><span>Total</span><span>${money(t)}</span></div>`;
  open('sCK');
}

document.addEventListener('click',e=>{
  if(e.target.matches('[data-wrap]')) return closeAll();
  const el=e.target.closest('[data-a]'); if(!el) return;
  const id=el.dataset.id?+el.dataset.id:null;
  A[el.dataset.a]?.(id,el);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
window.addEventListener('scroll',()=>$('#top').classList.toggle('s',scrollY>20),{passive:true});

/* Indicadores de la carrusel de promociones */
$('#promoRow')?.addEventListener('scroll',e=>{
  const el=e.target, idx=Math.round(el.scrollLeft/(el.firstElementChild.offsetWidth+14));
  $$('#dots i').forEach((d,i)=>d.classList.toggle('on',i===idx));
},{passive:true});


(function intro(){
  const s=$('#splash'), hide=()=>s.classList.add('done');
  s.addEventListener('click',hide);
  setTimeout(hide,2400);
})();

$('#yr').textContent=new Date().getFullYear();
renderPromos(); renderTop(); renderCats(); renderCart();
</script>
</body>
</html>
